name: Android CI & Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'      
    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Prepare APK Asset
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/KazuhiraSync.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KazuhiraSync-apk
        path: app/build/outputs/apk/debug/KazuhiraSync.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/KazuhiraSync.apk
        name: Kazuhira Sync ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
